services:
  # ── Backend API ─────────────────────────────────────────────────────────
  - type: web
    name: expenseflow-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false   # set manually in Render dashboard

  # ── Frontend Static Site ─────────────────────────────────────────────────
  - type: web
    name: expenseflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://expenseflow-backend-j1a1.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
